<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Fire Like Bot</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:white;font-family:Arial,sans-serif;padding:22px 16px}
.app{max-width:420px;margin:auto}
.header{text-align:center;padding:20px 10px}
.logo{font-size:42px}
h2{margin:10px 0;color:#fff}
.sub{color:#9aabc4;font-size:14px}
.profile{background:#17243a;border:1px solid #2c405c;border-radius:16px;padding:17px;margin:15px 0 22px}
.profile p{margin:8px 0}
.balance{color:#48e0a4;font-size:21px;font-weight:bold}
h3{font-size:15px;color:#a9bad3;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:13px;color:white;font-size:14px;font-weight:bold;min-height:68px;padding:12px 7px;box-shadow:0 5px 14px #0004}
.blue{background:linear-gradient(135deg,#168cff,#3158e8)}
.green{background:linear-gradient(135deg,#0ecb88,#079e78)}
button span{display:block;font-size:23px;margin-bottom:7px}
.support{width:100%;margin-top:12px;min-height:58px}
.note{text-align:center;color:#71839f;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">🎮</div>
    <h2>FREE FIRE LIKE BOT</h2>
    <div class="sub">Fast • Easy • Trusted</div>
  </div>
  <div class="profile">
    <p>👤 Name: Redwan Bhai</p>
    <p>🆔 User ID: Your Telegram ID</p>
    <p>💰 Balance</p>
    <div class="balance">৳ 100.00</div>
  </div>
  <h3>🔥 MAIN MENU</h3>
  <div class="grid">
    <button class=" blue"><span>🛒</span>BUY DAILY LIKE</button>
    <button class=" green"><span>💰</span>ADD MONEY</button>
    <button class=" green"><span>👑</span>MY INFO</button>
    <button class=" blue"><span>📋</span>MY HISTORY</button>
    <button class=" blue"><span>🎁</span>REFER &amp; EARN</button>
    <button class=" green"><span>💬</span>SUPPORT</button>
    <button class=" blue" style="grid-column:1/-1"><span>🔄</span>REFRESH BOT</button>
  </div>
  <div class="note">COLOR DESIGN PREVIEW • NOT CONNECTED TO BOT</div>
</div>
</body>
</html>
